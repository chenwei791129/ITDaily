# Keep replicas at 1: every pod start posts one Slack card.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-daily
  labels:
    app: it-daily
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-daily
  template:
    metadata:
      labels:
        app: it-daily
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: it-daily
          image: it-daily:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: it-daily-slack
                  key: webhook-url
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: it-daily
spec:
  selector:
    app: it-daily
  ports:
    - name: http
      port: 80
      targetPort: http
